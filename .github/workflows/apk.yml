# Builds the Android app and attaches it to a prerelease (never "latest", which
# belongs to the web update manifest). Runs when the Android shell changes, or by hand.
#
# Signing: set secrets APK_KEYSTORE_BASE64 (base64 of the keystore file) and
# APK_KEYSTORE_PASSWORD (optional APK_KEY_ALIAS, default androiddebugkey) so every
# APK has the same key and installs over the last one. Without them the APK is
# only uploaded as a workflow artifact.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "shell-api.txt", ".github/workflows/apk.yml"]
  workflow_dispatch:

concurrency:
  group: apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Version
        id: v
        run: |
          build=$(git rev-list --count HEAD)
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "apk=ManaBox-to-Moxfield-b$build.apk" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: key
        env:
          KS_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::APK_KEYSTORE_BASE64 is not set; building with a throwaway key and not publishing a release (it couldn't install over your current app)."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
          {
            echo "args=-PkeystorePath=$RUNNER_TEMP/app.keystore -PkeystorePassword=${KS_PASS:-android} -PkeyAlias=${KS_ALIAS:-androiddebugkey}"
            echo "signed=true"
          } >> "$GITHUB_OUTPUT"

      - name: Tests and build
        working-directory: android
        env:
          BUILD: ${{ steps.v.outputs.build }}
          SIGN_ARGS: ${{ steps.key.outputs.args }}
        run: |
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon -PwebBuild="$BUILD" $SIGN_ARGS
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/${{ steps.v.outputs.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.apk }}
          path: ${{ steps.v.outputs.apk }}

      - name: Attach to a release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.v.outputs.build }}
          SHA: ${{ steps.v.outputs.sha }}
          APK: ${{ steps.v.outputs.apk }}
        run: |
          set -euo pipefail
          tag="apk-b$BUILD"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --prerelease --latest=false --title "Android app build $BUILD ($SHA)" \
            --notes "Install on your phone (it installs over the previous version). Web updates then arrive by themselves." "$APK"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$APK" >> "$GITHUB_STEP_SUMMARY"
