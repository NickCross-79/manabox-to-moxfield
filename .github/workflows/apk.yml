# Builds the Android app and attaches it to a prerelease (never "latest", which
# belongs to the web update manifest). Runs when the Android shell changes, or by hand.
# Needs no setup. Each build is signed with the build machine's own key, so installing
# a new APK means uninstalling the old app first. Web updates never need a new APK.
name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "shell-api.txt"]
  workflow_dispatch:

concurrency:
  group: apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Version
        id: v
        run: |
          build=$(git rev-list --count HEAD)
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "apk=ManaBox-to-Moxfield-b$build.apk" >> "$GITHUB_OUTPUT"

      - name: Tests and build
        working-directory: android
        env:
          BUILD: ${{ steps.v.outputs.build }}
        run: |
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon -PwebBuild="$BUILD"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/${{ steps.v.outputs.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.apk }}
          path: ${{ steps.v.outputs.apk }}

      - name: Attach to a release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.v.outputs.build }}
          SHA: ${{ steps.v.outputs.sha }}
          APK: ${{ steps.v.outputs.apk }}
        run: |
          set -euo pipefail
          tag="apk-b$BUILD"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --prerelease --latest=false --title "Android app build $BUILD ($SHA)" \
            --notes "Uninstall the old Mana→Mox app first, then install this one. Web updates then arrive by themselves." "$APK"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$APK" >> "$GITHUB_STEP_SUMMARY"
